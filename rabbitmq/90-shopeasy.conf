# Mounted into the broker by docker-compose.yml (/etc/rabbitmq/conf.d/). README, "Dependencies".
#
# The Prometheus plugin (rabbitmq_prometheus, on by default in the official image) serves its numbers on
# port 15692. By default it adds all queues up into one figure; with this setting every queue gets its
# own series (rabbitmq_queue_messages_ready{queue="payment-process"}), which is what the alerts and the
# dashboards need. Per-queue series cost memory on a broker with thousands of queues; this one has a few dozen.
prometheus.return_per_object_metrics = true
