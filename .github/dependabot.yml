# Weekly pull requests for outdated dependencies. Each PR runs the full CI, so an update only
# gets merged when the build, the tests and the vulnerability audit are green.
version: 2

updates:
  # NuGet packages of every project in the solution
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      serilog:
        patterns: ["Serilog*"]
      masstransit:
        patterns: ["MassTransit*"]
      test-tooling:
        patterns: ["xunit*", "FluentAssertions", "NSubstitute", "coverlet*", "Microsoft.NET.Test.Sdk"]
      # Everything else that is a minor or patch update: ONE pull request for all packages in
      # all projects, instead of one per package and project (a re-scan once produced twenty).
      # A package goes into the first group that matches it, so this catch-all stays last.
      # Major versions are never grouped: each arrives as its own pull request to be judged.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The services target .NET 8 (LTS). Staying on 8.x of the framework-bound packages is
      # deliberate; moving to .NET 9/10 is a project decision, not an automatic bump.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      - dependency-name: "AspNetCore.HealthChecks.*"
        update-types: ["version-update:semver-major"]
      # Major upgrades that need a decision and a code change, not a bump:
      #  - MassTransit stays on 8.2.x: 8.5+ pulls RabbitMQ.Client 7, which removes the synchronous
      #    API the dead-letter tooling (ErrorQueueClient) is written against, so the Order service
      #    stops compiling (tried in a Dependabot pull request). Moving needs that port first.
      #    MassTransit 9 is also no longer Apache-2.0 (Massient license, see
      #    https://massient.com/license). All services must move together either way.
      #  - Swashbuckle 10 moves from Microsoft.OpenApi 1.x to 2.x, a breaking API change that
      #    needs code changes in every service that serves Swagger.
      #  - Serilog.AspNetCore 10 is already in use; later majors follow the framework version.
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "Swashbuckle.AspNetCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.AspNetCore"
        update-types: ["version-update:semver-major"]

  # Base images in the six service Dockerfiles
  - package-ecosystem: docker
    directories:
      - /src/Identity/ShopEasy.Identity
      - /src/Gateway/ShopEasy.Gateway
      - /src/Services/ShopEasy.ProductService
      - /src/Services/ShopEasy.InventoryService
      - /src/Services/ShopEasy.PaymentService
      - /src/Services/ShopEasy.OrderService
    schedule:
      interval: weekly
    groups:
      # one pull request per week for all six services, not twelve
      dotnet-images:
        patterns: ["dotnet/*"]
    ignore:
      # Keep the .NET 8 SDK / ASP.NET runtime images. Dependabot names these images
      # "dotnet/aspnet" and "dotnet/sdk" — WITHOUT the "mcr.microsoft.com/" registry prefix —
      # so a pattern with the prefix matches nothing (the first run proposed 8.0 -> 10.0 for
      # every service). Moving to a newer .NET is a project decision, not an automatic bump.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  # The actions used by the workflows above
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # one pull request for all action updates instead of one per action
      github-actions:
        patterns: ["*"]
