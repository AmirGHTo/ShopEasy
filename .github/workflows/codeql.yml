name: CodeQL

# Static analysis of the C# code for security problems (injection, unsafe deserialization, weak
# cryptography, secrets in code, ...). Alerts show up under Security -> Code scanning; the job does
# not fail because of an alert. A separate workflow, so it is not part of "CI passed" and never
# holds up publishing images.
# Runs on pull requests that change more than documentation, on every push to main, and once a
# week: new queries appear without any change in the code.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # build-mode none reads the source and the restored packages; no build is needed.
      # The test projects are left out: their fixed passwords and URLs are test data, and alerts
      # there would bury the ones in the services.
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - src/Tests

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
