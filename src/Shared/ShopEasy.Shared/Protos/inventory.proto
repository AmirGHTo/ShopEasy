syntax = "proto3";

option csharp_namespace = "ShopEasy.Shared.Grpc";

package inventory;

// The inventory gRPC service
// Used internally by OrderService to check stock before confirming orders
service InventoryGrpc {
  // Check stock for a single product
  rpc GetStock (GetStockRequest) returns (StockResponse);

  // Check stock for multiple products at once (batch)
  rpc GetStockBatch (GetStockBatchRequest) returns (GetStockBatchResponse);
}

message GetStockRequest {
  string product_id = 1;
}

message StockResponse {
  string product_id       = 1;
  string product_name     = 2;
  int32  quantity         = 3;
  int32  reserved_qty     = 4;
  int32  available_qty    = 5;
  bool   is_low_stock     = 6;
  bool   found            = 7; // false if product not in inventory
}

message GetStockBatchRequest {
  repeated string product_ids = 1;
}

message GetStockBatchResponse {
  repeated StockResponse items = 1;
}