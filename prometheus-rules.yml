# Alert rules for the business metrics. Firing alerts are listed at http://localhost:9090/alerts;
# sending them anywhere (e-mail, chat, a pager) needs an Alertmanager, which is not part of this stack.
groups:
  - name: shopeasy-orders
    rules:
      - alert: OrderStuck
        expr: max(shopeasy_saga_oldest_active_age_seconds) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An order has been in progress for more than 10 minutes
          description: The oldest active order is {{ $value | humanizeDuration }} old. The saga timeout service should have settled it long before.

      - alert: OrderFailed
        expr: sum(increase(shopeasy_order_outcomes_total{outcome="failed"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: The orchestrator gave up on an order, and a person has to look at it

      - alert: StockMayHaveLeaked
        expr: sum(increase(shopeasy_order_outcomes_total{reason="release_not_confirmed"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: An order was cancelled but the release of its reserved stock was never confirmed

      - alert: OutboxBacklog
        expr: max(shopeasy_outbox_pending_messages) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 50 events are waiting in the Order outbox, so the broker is probably unreachable

      - alert: SagaCommandsNotSent
        expr: max(shopeasy_saga_command_oldest_pending_age_seconds) > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A saga command has been waiting in the Order outbox for more than 2 minutes, so the broker is probably unreachable

      - alert: PollingLoopStalled
        expr: time() - shopeasy_background_loop_last_success_timestamp_seconds > 120
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A polling loop of the Order service has completed no pass for 2 minutes
          description: The {{ $labels.loop }} loop last completed a pass {{ $value | humanizeDuration }} ago. It fails (see the Order service log) or hangs.

  - name: shopeasy-consistency
    rules:
      # The Order service compares the orders that have settled with what Payment holds for them. A
      # finding is counted only when two passes in a row see it, and stays counted until it is put right.
      # Several Order replicas each run the check, so the maximum is taken.
      - alert: OrderConsistencyViolated
        expr: max by (rule) (shopeasy_consistency_violations) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: An order disagrees with what Payment holds for it ({{ $labels.rule }})
          description: >-
            {{ $value }} order(s) break the rule {{ $labels.rule }} (confirmed_not_paid: goods without a payment;
            amount_differs: charged another amount; paid_twice: charged twice; cancelled_still_charged: cancelled
            but the charge stands). Search the Order service log for "CONSISTENCY VIOLATION": each line names the
            order and what Payment holds. Nothing was changed automatically.

  - name: shopeasy-payments
    rules:
      - alert: PaymentsDeclinedHigh
        expr: |
          sum(increase(shopeasy_payments_total{result="declined"}[15m]))
            / sum(increase(shopeasy_payments_total{result=~"succeeded|declined"}[15m])) > 0.3
          and sum(increase(shopeasy_payments_total{result=~"succeeded|declined"}[15m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 30% of the last payments were declined
          description: The simulated provider declines about 10%. A rate this high points to a broken provider or a bad deployment.
