# Alert rules. Firing alerts are listed at http://localhost:9090/alerts and sent to Alertmanager
# (alertmanager.yml), which mails them to a local mailbox (Mailpit, http://localhost:8025). Every alert
# carries a `severity` and a `runbook_url`: the README section "Runbooks" has one heading per alert
# (.github/scripts/check-alert-rules.py fails the build if one is missing). Fork? Change the base of
# the runbook_url values to your repository.
groups:
  - name: shopeasy-orders
    rules:
      - alert: OrderStuck
        expr: max(shopeasy_saga_oldest_active_age_seconds) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#orderstuck
          summary: An order has been in progress for more than 10 minutes
          description: The oldest active order is {{ $value | humanizeDuration }} old. The saga timeout service should have settled it long before.

      - alert: OrderFailed
        expr: sum(increase(shopeasy_order_outcomes_total{outcome="failed"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#orderfailed
          summary: The orchestrator gave up on an order, and a person has to look at it

      # A message that failed all its retries waits in an error queue until a person requeues it. The Order
      # service exports how many wait in each (shopeasy_error_queue_messages, 0 when empty). Every Order replica
      # reports the same queues, so the maximum per queue is taken. If the broker cannot be read the monitor keeps
      # the last value and fails its pass (PollingLoopStalled), so a broker outage never looks like "no dead letters".
      - alert: DeadLettersPresent
        expr: max by (queue) (shopeasy_error_queue_messages) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#deadletterspresent
          summary: Messages that failed all their retries are waiting in an error queue
          description: The queue {{ $labels.queue }} holds {{ $value }} message(s). A person has to find the cause and requeue them (Dead Letter Monitor, /deadletters).

      - alert: StockMayHaveLeaked
        expr: sum(increase(shopeasy_order_outcomes_total{reason="release_not_confirmed"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#stockmayhaveleaked
          summary: An order was cancelled but the release of its reserved stock was never confirmed

      - alert: OutboxBacklog
        expr: max(shopeasy_outbox_pending_messages) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#outboxbacklog
          summary: More than 50 events are waiting in the Order outbox, so the broker is probably unreachable

      - alert: SagaCommandsNotSent
        expr: max(shopeasy_saga_command_oldest_pending_age_seconds) > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#sagacommandsnotsent
          summary: A saga command has been waiting in the Order outbox for more than 2 minutes, so the broker is probably unreachable

      - alert: PollingLoopStalled
        expr: time() - shopeasy_background_loop_last_success_timestamp_seconds > 120
        for: 1m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#pollingloopstalled
          summary: A polling loop of the Order service has completed no pass for 2 minutes
          description: The {{ $labels.loop }} loop last completed a pass {{ $value | humanizeDuration }} ago. It fails (see the Order service log) or hangs.

  - name: shopeasy-consistency
    rules:
      # The Order service compares the orders that have settled with what Payment holds for them. A
      # finding is counted only when two passes in a row see it, and stays counted until it is put right.
      # Several Order replicas each run the check, so the maximum is taken.
      - alert: OrderConsistencyViolated
        expr: max by (rule) (shopeasy_consistency_violations) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#orderconsistencyviolated
          summary: An order disagrees with what Payment holds for it ({{ $labels.rule }})
          description: >-
            {{ $value }} order(s) break the rule {{ $labels.rule }} (confirmed_not_paid: goods without a payment;
            amount_differs: charged another amount; paid_twice: charged twice; cancelled_still_charged: cancelled
            but the charge stands). Search the Order service log for "CONSISTENCY VIOLATION": each line names the
            order and what Payment holds. Nothing was changed automatically.

  - name: shopeasy-payments
    rules:
      - alert: PaymentsDeclinedHigh
        expr: |
          sum(increase(shopeasy_payments_total{result="declined"}[15m]))
            / sum(increase(shopeasy_payments_total{result=~"succeeded|declined"}[15m])) > 0.3
          and sum(increase(shopeasy_payments_total{result=~"succeeded|declined"}[15m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#paymentsdeclinedhigh
          summary: More than 30% of the last payments were declined
          description: The simulated provider declines about 10%. A rate this high points to a broken provider or a bad deployment.

  # What a customer feels at the front door is what the gateway answers. A request that ends in a 5xx
  # (a service that is down, a timeout, a broken upstream) counts against the shop; a 4xx, including
  # the 429 of a rate limit, does not: that is the system doing its job.
  - name: shopeasy-availability
    rules:
      - record: shopeasy:gateway_server_errors:ratio_10m
        expr: |
          (sum(increase(http_requests_received_total{service="Gateway",code=~"5.."}[10m])) or vector(0))
            / sum(increase(http_requests_received_total{service="Gateway"}[10m]))

      - record: shopeasy:gateway_request_duration_seconds:p95_10m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="Gateway"}[10m])))

      # The application services only: RabbitMQ, PostgreSQL and Redis have their own alert (DependencyDown)
      - alert: ServiceDown
        expr: up{job=~"shopeasy-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#servicedown
          summary: "{{ $labels.job }} cannot be scraped"
          description: The service is down, or its metrics port ({{ $labels.instance }}) cannot be reached. Look at its health check and its log first.

      - alert: ShopServerErrorsHigh
        expr: |
          shopeasy:gateway_server_errors:ratio_10m > 0.02
          and sum(increase(http_requests_received_total{service="Gateway"}[10m])) >= 20
        for: 5m
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#shopservererrorshigh
          summary: More than 2% of the gateway's answers in the last 10 minutes were server errors
          description: "{{ $value | humanizePercentage }} of the answers were 5xx. The \"HTTP Error Rate\" panel of the ShopEasy Overview dashboard shows where they come from."

      - alert: ShopSlow
        expr: shopeasy:gateway_request_duration_seconds:p95_10m > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#shopslow
          summary: 1 request in 20 takes longer than 2 seconds
          description: The 95th percentile of the gateway's answer time over the last 10 minutes is {{ $value | humanizeDuration }}.

  # Service level objectives and how fast the error budget burns (README, "Service level objectives").
  # Two measures of the gateway, each a share of requests that were bad:
  #   availability: the answer was a server error (5xx). Objective 99.5 % over 30 days, so the budget is 0.5 %.
  #   latency:      the answer took longer than 2 seconds. Objective 95 % under 2 s, so the budget is 5 %.
  # (The slowest histogram bucket edge not above 2 s would be 1.024; the first one above is 2.048, which is
  # what is counted: a request between 2 and 2.048 s counts as fast.) Health checks are left out of both.
  # A burn rate of 1 uses the budget exactly as fast as the month allows; 14.4 would use it up in 2 days.
  - name: shopeasy-slo
    interval: 1m
    rules:
      - record: shopeasy:slo_budget:ratio
        labels:
          sli: availability
        expr: vector(0.005)

      - record: shopeasy:slo_budget:ratio
        labels:
          sli: latency
        expr: vector(0.05)

      # How much the gateway was asked, for the alerts: a ratio of a handful of requests says nothing
      - record: shopeasy:gateway_requests:increase1h
        expr: sum(increase(http_requests_received_total{service="Gateway",endpoint!~"/health.*"}[1h]))

      - record: shopeasy:gateway_requests:increase6h
        expr: sum(increase(http_requests_received_total{service="Gateway",endpoint!~"/health.*"}[6h]))

      # The share of bad requests over six windows (the 30 days are what the error-budget panel adds up:
      # Prometheus has to keep that long, see --storage.tsdb.retention.time in docker-compose.yml)
      - record: shopeasy:gateway_bad_ratio:rate5m
        labels:
          sli: availability
        expr: |
          (sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*",code=~"5.."}[5m])) or vector(0))
            / sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*"}[5m]))

      - record: shopeasy:gateway_bad_ratio:rate5m
        labels:
          sli: latency
        expr: |
          1 - sum(rate(http_request_duration_seconds_bucket{service="Gateway",endpoint!~"/health.*",le="2.048"}[5m]))
            / sum(rate(http_request_duration_seconds_count{service="Gateway",endpoint!~"/health.*"}[5m]))

      - record: shopeasy:gateway_bad_ratio:rate30m
        labels:
          sli: availability
        expr: |
          (sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*",code=~"5.."}[30m])) or vector(0))
            / sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*"}[30m]))

      - record: shopeasy:gateway_bad_ratio:rate30m
        labels:
          sli: latency
        expr: |
          1 - sum(rate(http_request_duration_seconds_bucket{service="Gateway",endpoint!~"/health.*",le="2.048"}[30m]))
            / sum(rate(http_request_duration_seconds_count{service="Gateway",endpoint!~"/health.*"}[30m]))

      - record: shopeasy:gateway_bad_ratio:rate1h
        labels:
          sli: availability
        expr: |
          (sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*",code=~"5.."}[1h])) or vector(0))
            / sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*"}[1h]))

      - record: shopeasy:gateway_bad_ratio:rate1h
        labels:
          sli: latency
        expr: |
          1 - sum(rate(http_request_duration_seconds_bucket{service="Gateway",endpoint!~"/health.*",le="2.048"}[1h]))
            / sum(rate(http_request_duration_seconds_count{service="Gateway",endpoint!~"/health.*"}[1h]))

      - record: shopeasy:gateway_bad_ratio:rate6h
        labels:
          sli: availability
        expr: |
          (sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*",code=~"5.."}[6h])) or vector(0))
            / sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*"}[6h]))

      - record: shopeasy:gateway_bad_ratio:rate6h
        labels:
          sli: latency
        expr: |
          1 - sum(rate(http_request_duration_seconds_bucket{service="Gateway",endpoint!~"/health.*",le="2.048"}[6h]))
            / sum(rate(http_request_duration_seconds_count{service="Gateway",endpoint!~"/health.*"}[6h]))

      - record: shopeasy:gateway_bad_ratio:rate3d
        labels:
          sli: availability
        expr: |
          (sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*",code=~"5.."}[3d])) or vector(0))
            / sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*"}[3d]))

      - record: shopeasy:gateway_bad_ratio:rate3d
        labels:
          sli: latency
        expr: |
          1 - sum(rate(http_request_duration_seconds_bucket{service="Gateway",endpoint!~"/health.*",le="2.048"}[3d]))
            / sum(rate(http_request_duration_seconds_count{service="Gateway",endpoint!~"/health.*"}[3d]))

      - record: shopeasy:gateway_bad_ratio:rate30d
        labels:
          sli: availability
        expr: |
          (sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*",code=~"5.."}[30d])) or vector(0))
            / sum(rate(http_requests_received_total{service="Gateway",endpoint!~"/health.*"}[30d]))

      - record: shopeasy:gateway_bad_ratio:rate30d
        labels:
          sli: latency
        expr: |
          1 - sum(rate(http_request_duration_seconds_bucket{service="Gateway",endpoint!~"/health.*",le="2.048"}[30d]))
            / sum(rate(http_request_duration_seconds_count{service="Gateway",endpoint!~"/health.*"}[30d]))

      # The two ways to be told. Both ask two windows at once: the long one says the budget is really being spent,
      # the short one says it is still being spent now (so an alert ends soon after the cause is gone).
      # Fewer requests than the guard says is too little to judge: a rate limit or a night's few requests must not page.
      - alert: ErrorBudgetFastBurn
        expr: |
          (
            shopeasy:gateway_bad_ratio:rate1h / on(sli) shopeasy:slo_budget:ratio > 14.4
            and
            shopeasy:gateway_bad_ratio:rate5m / on(sli) shopeasy:slo_budget:ratio > 14.4
          )
          and on() shopeasy:gateway_requests:increase1h >= 100
        for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#errorbudgetfastburn
          summary: "The gateway's {{ $labels.sli }} budget is burning 14 times too fast"
          description: "Over the last hour the {{ $labels.sli }} budget was spent {{ $value | printf \"%.1f\" }} times as fast as a 30-day month allows, and it still is (last 5 minutes). At this rate the whole month's budget is gone in about 2 days."

      - alert: ErrorBudgetSlowBurn
        expr: |
          (
            shopeasy:gateway_bad_ratio:rate6h / on(sli) shopeasy:slo_budget:ratio > 6
            and
            shopeasy:gateway_bad_ratio:rate30m / on(sli) shopeasy:slo_budget:ratio > 6
          )
          and on() shopeasy:gateway_requests:increase6h >= 300
        for: 15m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#errorbudgetslowburn
          summary: "The gateway's {{ $labels.sli }} budget is leaking: 6 times too fast for hours"
          description: "Over the last 6 hours the {{ $labels.sli }} budget was spent {{ $value | printf \"%.1f\" }} times as fast as a 30-day month allows, and it still is (last 30 minutes). Too slow to page, but the month's budget would be gone in 5 days."

  - name: shopeasy-dependencies
    rules:
      # What the services depend on: RabbitMQ (its own metrics), PostgreSQL and Redis (through their exporters).
      # README, "Dependencies". The queue alerts leave out the error queues: a message that waits there has
      # its own alert (DeadLettersPresent), and nobody consumes an error queue on purpose.
      - alert: DependencyDown
        # the target cannot be scraped (the broker, or an exporter), or the exporter is up and says its server is not
        expr: up{job=~"rabbitmq|postgres|redis"} == 0 or pg_up == 0 or redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#dependencydown
          summary: "{{ $labels.job }} is down or cannot be measured"
          description: The {{ $labels.job }} metrics at {{ $labels.instance }} are missing or report the server as down. Orders and sign-ins fail or wait while it lasts.

      - alert: QueueWithoutConsumers
        expr: rabbitmq_queue_consumers{queue!~".*_(error|skipped)"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#queuewithoutconsumers
          summary: Nothing is reading the queue {{ $labels.queue }}
          description: The queue {{ $labels.queue }} has had no consumer for 2 minutes, so what is sent to it waits. The service that reads it is down, or has lost its connection to the broker and not found it again.

      - alert: QueueBacklogGrowing
        expr: |
          max by (queue) (rabbitmq_queue_messages_ready{queue!~".*_(error|skipped)"}) > 100
          and
          max by (queue) (delta(rabbitmq_queue_messages_ready{queue!~".*_(error|skipped)"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#queuebackloggrowing
          summary: The queue {{ $labels.queue }} is filling up faster than it is read
          description: "{{ $value | humanize }} messages have been waiting for 5 minutes or more in {{ $labels.queue }}, and the number keeps rising: the consumers are too slow or stuck."

      - alert: PostgresConnectionsHigh
        expr: max(pg_connections_used) / max(pg_connections_max) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#postgresconnectionshigh
          summary: More than 80% of the PostgreSQL connections are in use
          description: "{{ $value | humanizePercentage }} of max_connections are open. At 100% the services cannot open another connection and requests fail."

  # The shop as a customer sees it, measured from outside: the probe (src/Tools/ShopEasy.Probe, README, "A
  # synthetic order every minute") signs in, orders, waits for the confirmation and cancels, once a minute,
  # through the gateway. These alerts exist only when the probe runs (docker compose --profile probe).
  - name: shopeasy-synthetic
    rules:
      # shopeasy_probe_success{step} is 0 for the step that failed in the last run and absent for the steps
      # after it. The step is taken from there, and the count of failed runs from the other gauge: one failed
      # run is a hiccup, three in a row (three minutes) is the shop.
      - alert: SyntheticOrderFailing
        expr: (shopeasy_probe_success == 0) and on(job, instance) (shopeasy_probe_consecutive_failures >= 3)
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#syntheticorderfailing
          summary: "The probe's order has failed at the {{ $labels.step }} step in three runs in a row"
          description: "A customer's journey (sign in, product, order, confirmation, cancellation) does not work: the last run stopped at {{ $labels.step }}. The runbook says what each step points at."

      # A probe that is gone (its container stopped) leaves no current series (a failed scrape marks them stale):
      # the alert looks back for the last time it reported, up to six hours. A run ends within about 3.5 minutes
      # even when the shop hangs (a step is cut off after three times its timeout), so 5 minutes without one
      # is a probe that does not run.
      - alert: SyntheticProbeStale
        expr: time() - last_over_time(shopeasy_probe_last_run_timestamp_seconds[6h]) > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#syntheticprobestale
          summary: The synthetic probe has not finished a run for 5 minutes
          description: "The last run ended {{ $value | humanizeDuration }} ago. Without the probe nobody is measuring the shop from outside, and SyntheticOrderFailing cannot fire."

  # An alert that always fires. If its mail stops arriving (or Alertmanager stops listing it), the chain
  # Prometheus -> Alertmanager -> mailbox is broken, which no other alert could tell us.
  - name: shopeasy-meta
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          runbook_url: https://github.com/AmirGHTo/ShopEasy/blob/main/README.md#watchdog
          summary: Alerting is working (this alert always fires)
          description: Prometheus evaluates its rules and Alertmanager receives the result. If this stops arriving, alerts would not be delivered either.
