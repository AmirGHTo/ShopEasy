# Alert rules for the business metrics. Firing alerts are listed at http://localhost:9090/alerts;
# sending them anywhere (e-mail, chat, a pager) needs an Alertmanager, which is not part of this stack.
groups:
  - name: shopeasy-orders
    rules:
      - alert: OrderStuck
        expr: max(shopeasy_saga_oldest_active_age_seconds) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An order has been in progress for more than 10 minutes
          description: The oldest active order is {{ $value | humanizeDuration }} old. The saga timeout service should have settled it long before.

      - alert: OrderFailed
        expr: sum(increase(shopeasy_order_outcomes_total{outcome="failed"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: The orchestrator gave up on an order, and a person has to look at it

      - alert: StockMayHaveLeaked
        expr: sum(increase(shopeasy_order_outcomes_total{reason="release_not_confirmed"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: An order was cancelled but the release of its reserved stock was never confirmed

      - alert: OutboxBacklog
        expr: max(shopeasy_outbox_pending_messages) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 50 events are waiting in the Order outbox, so the broker is probably unreachable

      - alert: SagaCommandsNotSent
        expr: max(shopeasy_saga_command_oldest_pending_age_seconds) > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A saga command has been waiting in the Order outbox for more than 2 minutes, so the broker is probably unreachable

      - alert: PollingLoopStalled
        expr: time() - shopeasy_background_loop_last_success_timestamp_seconds > 120
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A polling loop of the Order service has completed no pass for 2 minutes
          description: The {{ $labels.loop }} loop last completed a pass {{ $value | humanizeDuration }} ago. It fails (see the Order service log) or hangs.

  - name: shopeasy-payments
    rules:
      - alert: PaymentsDeclinedHigh
        expr: |
          sum(increase(shopeasy_payments_total{result="declined"}[15m]))
            / sum(increase(shopeasy_payments_total{result=~"succeeded|declined"}[15m])) > 0.3
          and sum(increase(shopeasy_payments_total{result=~"succeeded|declined"}[15m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 30% of the last payments were declined
          description: The simulated provider declines about 10%. A rate this high points to a broken provider or a bad deployment.

  # What a customer feels at the front door is what the gateway answers. A request that ends in a 5xx
  # (a service that is down, a timeout, a broken upstream) counts against the shop; a 4xx, including
  # the 429 of a rate limit, does not: that is the system doing its job.
  - name: shopeasy-availability
    rules:
      - record: shopeasy:gateway_server_errors:ratio_10m
        expr: |
          (sum(increase(http_requests_received_total{service="Gateway",code=~"5.."}[10m])) or vector(0))
            / sum(increase(http_requests_received_total{service="Gateway"}[10m]))

      - record: shopeasy:gateway_request_duration_seconds:p95_10m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="Gateway"}[10m])))

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} cannot be scraped"
          description: The service is down, or its metrics port ({{ $labels.instance }}) cannot be reached. Look at its health check and its log first.

      - alert: ShopServerErrorsHigh
        expr: |
          shopeasy:gateway_server_errors:ratio_10m > 0.02
          and sum(increase(http_requests_received_total{service="Gateway"}[10m])) >= 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 2% of the gateway's answers in the last 10 minutes were server errors
          description: "{{ $value | humanizePercentage }} of the answers were 5xx. The \"HTTP Error Rate\" panel of the ShopEasy Overview dashboard shows where they come from."

      - alert: ShopSlow
        expr: shopeasy:gateway_request_duration_seconds:p95_10m > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 1 request in 20 takes longer than 2 seconds
          description: The 95th percentile of the gateway's answer time over the last 10 minutes is {{ $value | humanizeDuration }}.
