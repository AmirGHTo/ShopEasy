# Run with: promtool test rules prometheus-rules.test.yml
rule_files:
  - prometheus-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: an order that stays in progress raises OrderStuck after the grace period
    input_series:
      - series: shopeasy_saga_oldest_active_age_seconds
        values: "700x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: OrderStuck
        exp_alerts: []
      - eval_time: 8m
        alertname: OrderStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: An order has been in progress for more than 10 minutes
              description: The oldest active order is 11m 40s old. The saga timeout service should have settled it long before.

  - interval: 1m
    name: a saga command that stays in the Order outbox raises SagaCommandsNotSent after the grace period
    input_series:
      - series: shopeasy_saga_command_oldest_pending_age_seconds
        values: "300x20"
    alert_rule_test:
      - eval_time: 1m
        alertname: SagaCommandsNotSent
        exp_alerts: []
      - eval_time: 5m
        alertname: SagaCommandsNotSent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: A saga command has been waiting in the Order outbox for more than 2 minutes, so the broker is probably unreachable

  - interval: 1m
    name: saga commands that are sent within seconds raise nothing
    input_series:
      - series: shopeasy_saga_command_oldest_pending_age_seconds
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: SagaCommandsNotSent
        exp_alerts: []

  - interval: 1m
    name: a young order raises nothing
    input_series:
      - series: shopeasy_saga_oldest_active_age_seconds
        values: "100x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: OrderStuck
        exp_alerts: []

  - interval: 1m
    name: a loop that completes no pass raises PollingLoopStalled, one that keeps completing passes does not
    input_series:
      - series: shopeasy_background_loop_last_success_timestamp_seconds{loop="saga_orchestrator"}
        values: "0x10"
      - series: shopeasy_background_loop_last_success_timestamp_seconds{loop="outbox_delivery_service"}
        values: "0+60x10"
    alert_rule_test:
      - eval_time: 2m
        alertname: PollingLoopStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: PollingLoopStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              loop: saga_orchestrator
            exp_annotations:
              summary: A polling loop of the Order service has completed no pass for 2 minutes
              description: The saga_orchestrator loop last completed a pass 5m 0s ago. It fails (see the Order service log) or hangs.

  - interval: 1m
    name: a mismatch between an order and its payment raises OrderConsistencyViolated, a clean check does not
    input_series:
      - series: shopeasy_consistency_violations{rule="cancelled_still_charged"}
        values: "0 0 1 1 1 1 1"
      - series: shopeasy_consistency_violations{rule="confirmed_not_paid"}
        values: "0x6"
    alert_rule_test:
      - eval_time: 1m
        alertname: OrderConsistencyViolated
        exp_alerts: []
      - eval_time: 5m
        alertname: OrderConsistencyViolated
        exp_alerts:
          - exp_labels:
              severity: critical
              rule: cancelled_still_charged
            exp_annotations:
              summary: An order disagrees with what Payment holds for it (cancelled_still_charged)
              description: >-
                1 order(s) break the rule cancelled_still_charged (confirmed_not_paid: goods without a payment;
                amount_differs: charged another amount; paid_twice: charged twice; cancelled_still_charged: cancelled
                but the charge stands). Search the Order service log for "CONSISTENCY VIOLATION": each line names the
                order and what Payment holds. Nothing was changed automatically.

  - interval: 1m
    name: a failed order raises OrderFailed at once
    input_series:
      - series: shopeasy_order_outcomes_total{outcome="failed", reason="orchestrator_error"}
        values: "0 0 1 1 1 1"
    alert_rule_test:
      - eval_time: 4m
        alertname: OrderFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: The orchestrator gave up on an order, and a person has to look at it

  - interval: 1m
    name: many declined payments raise PaymentsDeclinedHigh, the usual rate does not
    input_series:
      - series: shopeasy_payments_total{result="succeeded"}
        values: "0+3x30"
      - series: shopeasy_payments_total{result="declined"}
        values: "0+2x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: PaymentsDeclinedHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: More than 30% of the last payments were declined
              description: The simulated provider declines about 10%. A rate this high points to a broken provider or a bad deployment.

  - interval: 1m
    name: the usual share of declined payments raises nothing
    input_series:
      - series: shopeasy_payments_total{result="succeeded"}
        values: "0+9x30"
      - series: shopeasy_payments_total{result="declined"}
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: PaymentsDeclinedHigh
        exp_alerts: []
