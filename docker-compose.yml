# Applied to the six application containers (not to the third-party infrastructure images):
# no root, no extra privileges, nothing writable except /tmp. The Kubernetes manifests apply the
# same restrictions, so a problem shows up here and in CI before it shows up in a cluster.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Resilience settings (see the README, pattern 24). The values are the defaults of the code and of
# every service's appsettings.json; override one by putting the RESILIENCE_* variable in .env
# (the commented examples in .env.example). Merged into the environment of the services below.
x-resilience-postgres: &resilience-postgres
  Resilience__Postgres__LockTimeoutSeconds: "${RESILIENCE_PG_LOCK_TIMEOUT_SECONDS:-10}"
  Resilience__Postgres__IdleInTransactionTimeoutSeconds: "${RESILIENCE_PG_IDLE_IN_TRANSACTION_TIMEOUT_SECONDS:-60}"
  Resilience__Postgres__CommandTimeoutSeconds: "${RESILIENCE_PG_COMMAND_TIMEOUT_SECONDS:-30}"
  Resilience__Postgres__ConnectTimeoutSeconds: "${RESILIENCE_PG_CONNECT_TIMEOUT_SECONDS:-15}"
  Resilience__Postgres__MaxPoolSize: "${RESILIENCE_PG_MAX_POOL_SIZE:-20}"
  Resilience__Postgres__TcpKeepAliveSeconds: "${RESILIENCE_PG_TCP_KEEPALIVE_SECONDS:-30}"

x-resilience-consumers: &resilience-consumers
  Resilience__Consumers__TransientRetryLimit: "${RESILIENCE_CONSUMER_TRANSIENT_RETRY_LIMIT:-12}"
  Resilience__Consumers__TransientMinIntervalSeconds: "${RESILIENCE_CONSUMER_TRANSIENT_MIN_INTERVAL_SECONDS:-1}"
  Resilience__Consumers__TransientMaxIntervalSeconds: "${RESILIENCE_CONSUMER_TRANSIENT_MAX_INTERVAL_SECONDS:-60}"
  Resilience__Consumers__JitterRatio: "${RESILIENCE_CONSUMER_JITTER_RATIO:-0.2}"
  Resilience__Consumers__RetryLimit: "${RESILIENCE_CONSUMER_RETRY_LIMIT:-3}"
  Resilience__Consumers__MinIntervalSeconds: "${RESILIENCE_CONSUMER_MIN_INTERVAL_SECONDS:-1}"
  Resilience__Consumers__MaxIntervalSeconds: "${RESILIENCE_CONSUMER_MAX_INTERVAL_SECONDS:-10}"
  Resilience__Consumers__IntervalDeltaSeconds: "${RESILIENCE_CONSUMER_INTERVAL_DELTA_SECONDS:-2}"

x-resilience-retry-budget: &resilience-retry-budget
  Resilience__RetryBudget__Ratio: "${RESILIENCE_RETRY_BUDGET_RATIO:-0.2}"
  Resilience__RetryBudget__MinRetriesPerWindow: "${RESILIENCE_RETRY_BUDGET_MIN_RETRIES:-10}"
  Resilience__RetryBudget__WindowSeconds: "${RESILIENCE_RETRY_BUDGET_WINDOW_SECONDS:-10}"

# Redis is a cache only: a slow or missing Redis must cost a request a fraction of a second (README,
# pattern 16). Defaults of the code; override with REDIS_* in .env. Merged into product, inventory and order.
x-redis: &redis
  Redis__Connection: "redis:6379"
  Redis__ConnectTimeoutMs: "${REDIS_CONNECT_TIMEOUT_MS:-1000}"
  Redis__CommandTimeoutMs: "${REDIS_COMMAND_TIMEOUT_MS:-500}"

# The Swagger UI of the four APIs (ports 5101, 5103, 5104 and Order's) is on in this local stack and off
# in the code and in Kubernetes: set SWAGGER_ENABLED=false in .env before you expose the stack.
x-swagger: &swagger
  Swagger__Enabled: "${SWAGGER_ENABLED:-true}"

# Token validation and browser-facing security (see the README, "Authorization"). The values are the
# defaults of the code and of appsettings.json; override one with the variable in .env (examples in
# .env.example). identity-validation is merged into every service that validates tokens,
# web-security into the two services a browser talks to.
x-identity-validation: &identity-validation
  IdentityServer__RequireHttpsMetadata: "${IDENTITY_REQUIRE_HTTPS_METADATA:-false}"

x-web-security: &web-security
  Security__CookieSecurePolicy: "${SECURITY_COOKIE_SECURE_POLICY:-SameAsRequest}"
  ForwardedHeaders__Enabled: "${FORWARDED_HEADERS_ENABLED:-false}"
  ForwardedHeaders__KnownNetworks: "${FORWARDED_HEADERS_KNOWN_NETWORKS:-}"
  ForwardedHeaders__KnownProxies: "${FORWARDED_HEADERS_KNOWN_PROXIES:-}"

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopeasy-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     shopeasy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB:       shopeasy
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopeasy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shopeasy-net

  pgadmin:
    image: dpage/pgadmin4:8.6
    container_name: shopeasy-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@shopeasy.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    networks:
      - shopeasy-net
    depends_on:
      - postgres

  seq:
    image: datalust/seq:2024.1
    container_name: shopeasy-seq
    ports:
      - "5341:80"
      - "5342:5341"
    environment:
      ACCEPT_EULA: Y
    networks:
      - shopeasy-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: shopeasy-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml
    networks:
      - shopeasy-net
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:10.4.0
    container_name: shopeasy-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - shopeasy-net
    depends_on:
      - prometheus

  redis:
    image: redis:7-alpine
    container_name: shopeasy-redis
    ports:
      - "6379:6379"
    networks:
      - shopeasy-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: shopeasy-redis-insight
    ports:
      - "5540:5540"
    networks:
      - shopeasy-net
    depends_on:
      - redis

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: shopeasy-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Set RABBITMQ_ERLANG_COOKIE in .env}
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - shopeasy-net

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: shopeasy-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - shopeasy-net

  # ── Identity Provider ───────────────────────────────────────────────────────
  identity:
    <<: *hardened
    build:
      context: .
      dockerfile: src/Identity/ShopEasy.Identity/Dockerfile
    container_name: shopeasy-identity
    ports:
      - "5001:8080"
    environment:
      <<: [*resilience-postgres, *web-security]
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=shopeasy_identity;Username=shopeasy;Password=${POSTGRES_PASSWORD}"
      Clients__Gateway__Secret: ${GATEWAY_CLIENT_SECRET:?Set GATEWAY_CLIENT_SECRET in .env}
      Clients__OrderService__Secret: ${ORDER_SERVICE_CLIENT_SECRET:?Set ORDER_SERVICE_CLIENT_SECRET in .env}
      # Demo users are only created when Seed__Enabled is true (local development)
      Seed__Enabled: "${SEED_DEMO_USERS:-false}"
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__CustomerPassword: ${SEED_CUSTOMER_PASSWORD:-}
      # The first administrator of a real deployment: created once, only while no admin exists
      Bootstrap__AdminEmail: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Customers creating their own account, and how often one client may submit the sign-in (and
      # password-change) and sign-up forms (README, "How to Use It")
      Registration__Enabled: "${REGISTRATION_ENABLED:-true}"
      RateLimiting__Login__PermitLimit: "${RATE_LIMIT_LOGIN_ATTEMPTS:-10}"
      RateLimiting__Login__WindowSeconds: "${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}"
      RateLimiting__Registration__PermitLimit: "${RATE_LIMIT_REGISTRATION_ATTEMPTS:-10}"
      RateLimiting__Registration__WindowSeconds: "${RATE_LIMIT_REGISTRATION_WINDOW_SECONDS:-3600}"
    # Signing keys, Data Protection keys and issued grants are stored in PostgreSQL (no volume).
    # Optional: encrypt the key ring with a certificate you mount (see the README, "Identity key
    # protection"): DataProtection__CertificatePath / DataProtection__CertificatePassword.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - shopeasy-net

  # ── Product Service ─────────────────────────────────────────────────────────
  product:
    <<: *hardened
    build:
      context: .
      dockerfile: src/Services/ShopEasy.ProductService/Dockerfile
    container_name: shopeasy-product
    ports:
      - "5101:8080"
    environment:
      <<: [*resilience-postgres, *redis, *identity-validation, *swagger]
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=shopeasy_products;Username=shopeasy;Password=${POSTGRES_PASSWORD}"
      IdentityServer__Authority: "http://identity:8080"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shopeasy-net

  # ── Inventory Service ───────────────────────────────────────────────────────
  inventory:
    <<: *hardened
    build:
      context: .
      dockerfile: src/Services/ShopEasy.InventoryService/Dockerfile
    container_name: shopeasy-inventory
    ports:
      - "5103:8080"
    environment:
      <<: [*resilience-postgres, *resilience-consumers, *redis, *identity-validation, *swagger]
      # Enable HTTP/2 for gRPC (required)
      ASPNETCORE_HTTP_PORTS: ""   # disable default
        # Force HTTP/2 support
      DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "1"
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=shopeasy_inventory;Username=shopeasy;Password=${POSTGRES_PASSWORD}"
      IdentityServer__Authority: "http://identity:8080"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shopeasy-net

  # ── Payment Service ─────────────────────────────────────────────────────────
  payment:
    <<: *hardened
    build:
      context: .
      dockerfile: src/Services/ShopEasy.PaymentService/Dockerfile
    container_name: shopeasy-payment
    ports:
      - "5104:8080"
    environment:
      <<: [*resilience-postgres, *resilience-consumers, *identity-validation, *swagger]
      ASPNETCORE_URLS: http://+:8080
      Testing__ForcePaymentSuccess: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=shopeasy_payments;Username=shopeasy;Password=${POSTGRES_PASSWORD}"
      IdentityServer__Authority: "http://identity:8080"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shopeasy-net

  # ── Order Service ───────────────────────────────────────────────────────────
  order:
    <<: *hardened
    build:
      context: .
      dockerfile: src/Services/ShopEasy.OrderService/Dockerfile
    # container_name: shopeasy-order
    ports:
      - "8080"        # ← change from "5102:8080" to just "8080" (dynamic host port)
    environment:
      <<: [*resilience-postgres, *resilience-consumers, *resilience-retry-budget, *redis, *identity-validation, *swagger]
      # Calls to the Inventory service (the stock check): deadline, retries, circuit breaker
      Resilience__Inventory__TimeoutSeconds: "${RESILIENCE_INVENTORY_TIMEOUT_SECONDS:-3}"
      Resilience__Inventory__MaxRetries: "${RESILIENCE_INVENTORY_MAX_RETRIES:-2}"
      Resilience__Inventory__BreakDurationSeconds: "${RESILIENCE_INVENTORY_BREAK_SECONDS:-15}"
      # Idempotency-Key on POST /api/orders (README, "Order API"). Both are optional.
      Idempotency__RequireKey: "${ORDER_IDEMPOTENCY_REQUIRE_KEY:-false}"
      Idempotency__RetentionHours: "${ORDER_IDEMPOTENCY_RETENTION_HOURS:-24}"
      # How often Order looks in its outbox table for saga commands to send to RabbitMQ (at least 50)
      Outbox__QueryDelayMs: "${ORDER_OUTBOX_QUERY_DELAY_MS:-500}"
      # How long the orchestrator keeps retrying an order's first step when it fails (README, compensation matrix)
      SagaOrchestrator__MaxAttempts: "${ORDER_SAGA_MAX_ATTEMPTS:-8}"
      SagaOrchestrator__FirstRetryPauseSeconds: "${ORDER_SAGA_FIRST_RETRY_PAUSE_SECONDS:-3}"
      SagaOrchestrator__MaxRetryPauseSeconds: "${ORDER_SAGA_MAX_RETRY_PAUSE_SECONDS:-60}"
      # A polling pass (orchestrator, timeout service, outbox delivery, dead-letter monitor) that hangs is cancelled after this
      BackgroundLoops__PassTimeoutSeconds: "${ORDER_LOOP_PASS_TIMEOUT_SECONDS:-120}"
      ASPNETCORE_URLS: http://+:8080
      Services__InventoryGrpcService: "http://inventory:8090"
      Services__ProductService:       "http://product:8080"
      DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "1"
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=shopeasy_orders;Username=shopeasy;Password=${POSTGRES_PASSWORD}"
      IdentityServer__Authority: "http://identity:8080"
      ServiceAuth__ClientId: "order-service"
      ServiceAuth__ClientSecret: ${ORDER_SERVICE_CLIENT_SECRET:?Set ORDER_SERVICE_CLIENT_SECRET in .env}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      # Link shown on the dead-letter page (humans only; the service itself never calls it)
      RabbitMQ__ManagementUiUrl: "http://localhost:15672"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
      inventory:
        condition: service_healthy
      product:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shopeasy-net

  # ── API Gateway ─────────────────────────────────────────────────────────────
  gateway:
    <<: *hardened
    build:
      context: .
      dockerfile: src/Gateway/ShopEasy.Gateway/Dockerfile
    container_name: shopeasy-gateway
    ports:
      - "5000:8080"
    environment:
      <<: [*resilience-retry-budget, *identity-validation, *web-security]
      # Proxying: timeout for a silent service, connection limits, retries of GETs
      Resilience__Gateway__ActivityTimeoutSeconds: "${RESILIENCE_GATEWAY_ACTIVITY_TIMEOUT_SECONDS:-30}"
      Resilience__Gateway__ConnectTimeoutSeconds: "${RESILIENCE_GATEWAY_CONNECT_TIMEOUT_SECONDS:-5}"
      Resilience__Gateway__PooledConnectionLifetimeSeconds: "${RESILIENCE_GATEWAY_POOLED_CONNECTION_LIFETIME_SECONDS:-120}"
      Resilience__Gateway__GetRetries: "${RESILIENCE_GATEWAY_GET_RETRIES:-2}"
      ASPNETCORE_URLS: http://+:8080
      IdentityServer__Authority: "http://identity:8080"
      IdentityServer__PublicUrl: "http://localhost:5001"
      Oidc__ClientSecret: ${GATEWAY_CLIENT_SECRET:?Set GATEWAY_CLIENT_SECRET in .env}
      # Exposes GET /account/token (raw access token) — local development only
      Features__ExposeAccessToken: "${EXPOSE_ACCESS_TOKEN:-false}"
      # Content-Security-Policy and the other security headers (README, "Security headers")
      SecurityHeaders__Enabled: "${SECURITY_HEADERS_ENABLED:-true}"
      SecurityHeaders__ImageSources: "${SECURITY_HEADERS_IMAGE_SOURCES:-https:}"
      ReverseProxy__Clusters__products-cluster__Destinations__primary__Address: "http://product:8080"
      ReverseProxy__Clusters__orders-cluster__Destinations__primary__Address: "http://order:8080"
      ReverseProxy__Clusters__inventory-cluster__Destinations__primary__Address: "http://inventory:8080"
      ReverseProxy__Clusters__payments-cluster__Destinations__primary__Address: "http://payment:8080"
    depends_on:
      identity:
        condition: service_healthy
      product:
        condition: service_healthy
      order:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shopeasy-net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  shopeasy-net:
    driver: bridge