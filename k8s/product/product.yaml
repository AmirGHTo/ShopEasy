apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: shopeasy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        # Only needed while the GHCR packages are private (see the README); harmless when public
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654        # the "app" user of the .NET base images
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # the only writable path: the .NET runtime keeps a few temporary files here
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: product
          # registry and pinned tag come from k8s/kustomization.yaml (images:)
          image: shopeasy-product
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shopeasy-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: products-db-connection
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: shopeasy
spec:
  selector:
    app: product
  ports:
    - port: 8080
      targetPort: 8080
