apiVersion: v1
kind: ConfigMap
metadata:
  name: shopeasy-config
  namespace: shopeasy
data:
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_ENVIRONMENT: "Production"
  IdentityServer__Authority: "http://identity:8080"
  # Fetch Identity's discovery document and signing keys only over HTTPS. Switch on as soon as the
  # authority above is an https:// address; the in-cluster default is plain HTTP (README, "Authorization").
  IdentityServer__RequireHttpsMetadata: "false"
  # Secure flag of the login and session cookies (gateway, Identity): Always for a deployment reached
  # over HTTPS. With an ingress that terminates TLS also enable ForwardedHeaders and list the ingress
  # controller's network, otherwise the services see plain HTTP.
  Security__CookieSecurePolicy: "SameAsRequest"
  # First administrator (Identity only): the account is created at start-up while no admin exists.
  # Its password is the optional "bootstrap-admin-password" key of the shopeasy-secrets Secret.
  Bootstrap__AdminEmail: ""
  # Customers creating their own account (Identity); "false" closes sign-up. The limits are the
  # submissions of the sign-in (and password-change) and sign-up forms one client address may make per window; behind an
  # ingress they only count per client once ForwardedHeaders is enabled below.
  Registration__Enabled: "true"
  RateLimiting__Login__PermitLimit: "10"
  RateLimiting__Login__WindowSeconds: "60"
  RateLimiting__Registration__PermitLimit: "10"
  RateLimiting__Registration__WindowSeconds: "3600"
  ForwardedHeaders__Enabled: "false"
  ForwardedHeaders__KnownNetworks: ""
  ForwardedHeaders__KnownProxies: ""
  RabbitMQ__Host: "rabbitmq"
  Redis__Connection: "redis:6379"
  # Seq (log explorer) is part of the Docker Compose stack only. Empty = do not ship logs to Seq;
  # logs still go to the container console. Set it to the URL of your own Seq to use one.
  Seq__ServerUrl: ""
  Services__ProductService: "http://product:8080"
  Services__InventoryGrpcService: "http://inventory:8090"
  DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "1"
  # Resilience (README, pattern 24). These are the defaults of the code; change one here and restart
  # the pods (kubectl -n shopeasy rollout restart deployment) for it to take effect. Services
  # without a database or a message consumer ignore the keys that do not apply to them.
  # Replicas x MaxPoolSize must stay below the PostgreSQL server's max_connections.
  Resilience__Postgres__LockTimeoutSeconds: "10"
  Resilience__Postgres__IdleInTransactionTimeoutSeconds: "60"
  Resilience__Postgres__CommandTimeoutSeconds: "30"
  Resilience__Postgres__ConnectTimeoutSeconds: "15"
  Resilience__Postgres__MaxPoolSize: "20"
  Resilience__Postgres__TcpKeepAliveSeconds: "30"
  Resilience__Consumers__TransientRetryLimit: "12"
  Resilience__Consumers__TransientMinIntervalSeconds: "1"
  Resilience__Consumers__TransientMaxIntervalSeconds: "60"
  Resilience__Consumers__JitterRatio: "0.2"
  Resilience__Consumers__RetryLimit: "3"
  Resilience__Consumers__MinIntervalSeconds: "1"
  Resilience__Consumers__MaxIntervalSeconds: "10"
  Resilience__Consumers__IntervalDeltaSeconds: "2"
  # Idempotency-Key on POST /api/orders (Order service; README, "Order API"). RequireKey rejects
  # order requests without the header; RetentionHours is how long a key is remembered.
  Idempotency__RequireKey: "false"
  Idempotency__RetentionHours: "24"
  # Order saga: when the first command of an order cannot be sent (message broker down), Order retries
  # after a growing pause (first, doubling, up to the maximum) and cancels the order after MaxAttempts
  # failures. The longest pause must stay below the saga timeout of 120 s.
  SagaOrchestrator__MaxAttempts: "8"
  SagaOrchestrator__FirstRetryPauseSeconds: "3"
  SagaOrchestrator__MaxRetryPauseSeconds: "60"
  # Calls between services (README, pattern 26). Order uses Resilience__Inventory__* and the retry
  # budget; the gateway uses Resilience__Gateway__* and the retry budget.
  Resilience__Inventory__TimeoutSeconds: "3"
  Resilience__Inventory__MaxRetries: "2"
  Resilience__Inventory__BreakDurationSeconds: "15"
  Resilience__Gateway__ActivityTimeoutSeconds: "30"
  Resilience__Gateway__ConnectTimeoutSeconds: "5"
  Resilience__Gateway__PooledConnectionLifetimeSeconds: "120"
  Resilience__Gateway__GetRetries: "2"
  Resilience__RetryBudget__Ratio: "0.2"
  Resilience__RetryBudget__MinRetriesPerWindow: "10"
  Resilience__RetryBudget__WindowSeconds: "10"
