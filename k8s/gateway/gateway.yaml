apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: shopeasy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: shopeasy-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: IdentityServer__Authority
              value: "http://identity:8080"
            - name: IdentityServer__PublicUrl
              value: "http://localhost:30001"
            - name: ReverseProxy__Clusters__orders-cluster__Destinations__primary__Address
              value: "http://order:8080"
            - name: ReverseProxy__Clusters__products-cluster__Destinations__primary__Address
              value: "http://product:8080"
            - name: ReverseProxy__Clusters__inventory-cluster__Destinations__primary__Address
              value: "http://inventory:8080"
            - name: ReverseProxy__Clusters__payments-cluster__Destinations__primary__Address
              value: "http://payment:8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: shopeasy
spec:
  selector:
    app: gateway
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30000
