apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: shopeasy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        # Only needed while the GHCR packages are private (see the README); harmless when public
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654        # the "app" user of the .NET base images
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # the only writable path: the .NET runtime keeps a few temporary files here
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: gateway
          # registry and pinned tag come from k8s/kustomization.yaml (images:)
          image: shopeasy-gateway
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # Seq is part of the Compose stack only; empty = console logs only (see the ConfigMap)
            - name: Seq__ServerUrl
              value: ""
            - name: IdentityServer__Authority
              value: "http://identity:8080"
            - name: IdentityServer__PublicUrl
              value: "http://localhost:30001"
            - name: Oidc__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: gateway-client-secret
            - name: ReverseProxy__Clusters__orders-cluster__Destinations__primary__Address
              value: "http://order:8080"
            - name: ReverseProxy__Clusters__products-cluster__Destinations__primary__Address
              value: "http://product:8080"
            - name: ReverseProxy__Clusters__inventory-cluster__Destinations__primary__Address
              value: "http://inventory:8080"
            - name: ReverseProxy__Clusters__payments-cluster__Destinations__primary__Address
              value: "http://payment:8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: shopeasy
spec:
  selector:
    app: gateway
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30000
