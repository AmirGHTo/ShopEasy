# Template — do NOT put real secrets in this file.
#   cp k8s/secrets/secrets.example.yaml k8s/secrets/secrets.yaml   (secrets.yaml is git-ignored)
#   edit every CHANGE_ME value, then: kubectl apply -f k8s/secrets/secrets.yaml
# In real clusters prefer an external secret store (External Secrets, Sealed Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: shopeasy-secrets
  namespace: shopeasy
type: Opaque
stringData:
  postgres-password:        "CHANGE_ME"
  rabbitmq-user:            "CHANGE_ME"
  rabbitmq-password:        "CHANGE_ME"
  rabbitmq-erlang-cookie:   "CHANGE_ME"
  order-client-secret:      "CHANGE_ME"
  gateway-client-secret:    "CHANGE_ME"
  # Connection strings must embed the same postgres-password (avoid ';' in the password)
  identity-db-connection:   "Host=postgres;Database=shopeasy_identity;Username=shopeasy;Password=CHANGE_ME"
  orders-db-connection:     "Host=postgres;Database=shopeasy_orders;Username=shopeasy;Password=CHANGE_ME"
  products-db-connection:   "Host=postgres;Database=shopeasy_products;Username=shopeasy;Password=CHANGE_ME"
  inventory-db-connection:  "Host=postgres;Database=shopeasy_inventory;Username=shopeasy;Password=CHANGE_ME"
  payments-db-connection:   "Host=postgres;Database=shopeasy_payments;Username=shopeasy;Password=CHANGE_ME"
