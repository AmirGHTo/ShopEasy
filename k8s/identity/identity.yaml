apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: shopeasy
spec:
  # Signing keys, Data Protection keys and issued grants live in PostgreSQL, so Identity can run
  # several replicas and be rolled without invalidating tokens. Deploy with 1 replica first (the
  # database migrations run at startup), then: kubectl -n shopeasy scale deployment identity --replicas=2
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        # Only needed while the GHCR packages are private (see the README); harmless when public
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654        # the "app" user of the .NET base images
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # the only writable path: the .NET runtime keeps a few temporary files here
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # The certificate that encrypts the Data Protection key ring (and with it the signing keys)
        # in the database. Create it as described in the README ("Identity key protection").
        - name: dataprotection
          secret:
            secretName: identity-dataprotection
            defaultMode: 0440
      containers:
        - name: identity
          # registry and pinned tag come from k8s/kustomization.yaml (images:)
          image: shopeasy-identity
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: dataprotection
              mountPath: /etc/shopeasy/dataprotection
              readOnly: true
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # Seq is part of the Compose stack only; empty = console logs only (see the ConfigMap)
            - name: Seq__ServerUrl
              value: ""
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: identity-db-connection
            - name: Clients__Gateway__Secret
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: gateway-client-secret
            - name: Clients__OrderService__Secret
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: order-client-secret
            - name: Seed__Enabled
              value: "false"
            # only used while no administrator exists (and Bootstrap__AdminEmail is set)
            - name: Bootstrap__AdminPassword
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: bootstrap-admin-password
                  optional: true
            - name: DataProtection__CertificatePath
              value: /etc/shopeasy/dataprotection/key-ring.pfx
            - name: DataProtection__CertificatePassword
              valueFrom:
                secretKeyRef:
                  name: identity-dataprotection
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: shopeasy
spec:
  selector:
    app: identity
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30001
