apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: shopeasy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
        - name: identity
          image: shopeasy-identity:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            # Seq is part of the Compose stack only; empty = console logs only (see the ConfigMap)
            - name: Seq__ServerUrl
              value: ""
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: identity-db-connection
            - name: Clients__Gateway__Secret
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: gateway-client-secret
            - name: Clients__OrderService__Secret
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: order-client-secret
            - name: Seed__Enabled
              value: "false"
          volumeMounts:
            - name: identity-keys
              mountPath: /app/keys
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - name: identity-keys
          persistentVolumeClaim:
            claimName: identity-keys-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-keys-pvc
  namespace: shopeasy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: shopeasy
spec:
  selector:
    app: identity
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30001
