apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: shopeasy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: shopeasy-inventory:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: shopeasy-config
          env:
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: rabbitmq-user
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: rabbitmq-password
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: inventory-db-connection
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: shopeasy
spec:
  selector:
    app: inventory
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8090
      targetPort: 8090
