apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: shopeasy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      automountServiceAccountToken: false
      # replicas on one node would be lost together with it: spread them over the nodes there are
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: order
      imagePullSecrets:
        # Only needed while the GHCR packages are private (see the README); harmless when public
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654        # the "app" user of the .NET base images
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # the only writable path: the .NET runtime keeps a few temporary files here
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: order
          # registry and pinned tag come from k8s/kustomization.yaml (images:)
          image: shopeasy-order
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shopeasy-config
          env:
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: rabbitmq-user
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: rabbitmq-password
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: orders-db-connection
            - name: ServiceAuth__ClientId
              value: "order-service"
            - name: ServiceAuth__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: shopeasy-secrets
                  key: order-client-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: shopeasy
spec:
  selector:
    app: order
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-hpa
  namespace: shopeasy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# A node drain (an upgrade, a repair) may take down one replica at a time, never the last one
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-pdb
  namespace: shopeasy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order
