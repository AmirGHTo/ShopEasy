global:
  scrape_interval:     15s
  evaluation_interval: 15s

# Relative to this file (/etc/prometheus in the container); see "Alert rules" in the README
rule_files:
  - prometheus-rules.yml

# Where firing alerts go: Alertmanager groups them and mails them (alertmanager.yml)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Every process serves its metrics on a port of its own (Metrics__Port, default 9091), not on the port
# of its API: the API ports are the ones that are published to the host or reachable from outside, and
# Compose does not publish 9091. The metrics are not authenticated, so that port must stay internal.
scrape_configs:
  - job_name: 'shopeasy-gateway'
    static_configs:
      - targets: ['gateway:9091']
    metrics_path: '/metrics'

  - job_name: 'shopeasy-product'
    static_configs:
      - targets: ['product:9091']
    metrics_path: '/metrics'

  - job_name: 'shopeasy-order'
    static_configs:
      - targets: ['order:9091']
    metrics_path: '/metrics'

  - job_name: 'shopeasy-inventory'
    static_configs:
      - targets: ['inventory:9091']
    metrics_path: '/metrics'

  - job_name: 'shopeasy-payment'
    static_configs:
      - targets: ['payment:9091']
    metrics_path: '/metrics'

  - job_name: 'shopeasy-identity'
    static_configs:
      - targets: ['identity:9091']
    metrics_path: '/metrics'

  # What the services depend on (README, "Dependencies"). Their ports are internal as well.
  # RabbitMQ serves its own metrics (rabbitmq_prometheus); the per-queue series are switched on in rabbitmq/90-shopeasy.conf
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics'

  # PostgreSQL and Redis through the exporters that sit next to them (docker-compose.yml)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: '/metrics'

  # The synthetic probe (README, "A synthetic order every minute"). It runs only with `--profile probe`, so
  # it is looked up in DNS instead of being listed: a stack without the probe has no target, where a static
  # one would be down all the time. When the probe stops its series go stale (a failed scrape does that), and
  # whether the job's `up` goes away or stays at 0 depends on how DNS answers for a name that no longer
  # exists; SyntheticProbeStale does not depend on it: it looks at the last time the probe reported.
  - job_name: 'probe'
    dns_sd_configs:
      - names: ['probe']
        type: A
        port: 9091
        refresh_interval: 15s
    metrics_path: '/metrics'
